name: tests

# Runs the full suite plus the paper regression. The "tests" badge in the
# README points at this workflow, so it reports real state rather than a
# hardcoded colour.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          # The engine is developed on Windows, so one Windows leg guards
          # against path and encoding regressions without tripling CI cost.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest tests/ -v --durations=10

  paper-regression:
    name: paper regression (published tables)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Exits non-zero if any published figure from Rockafellar & Uryasev
      # (2000) is missed, so a numerical regression fails the build rather
      # than being noticed later by a reader of the README.
      - name: Validate against the paper's published tables
        run: cvar-engine validate --scenarios 16384 --tolerance 1.0

      - name: Confirm the CLI entry points respond
        run: |
          cvar-engine --help
          cvar-engine paper-portfolio --scenarios 4096 --no-compare
          cvar-engine nikkei --scenarios 500

  figures:
    name: figures build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Regenerates into a scratch directory rather than docs/images, so the
      # committed figures are never silently overwritten by CI.
      - name: Regenerate every figure
        run: python -m src.visualization --output-dir "${RUNNER_TEMP}/figures"

      - name: Upload the figures as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: ${{ runner.temp }}/figures
          if-no-files-found: error
